[package]
name = "hub_core"
version = "1.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
jni = "0.21"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = "3"
url = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
